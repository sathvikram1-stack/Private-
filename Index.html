<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lekhya Sri ✦ Powerpuff World</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&family=Pacifico&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-deep:    #c2185b;
      --pink-vivid:   #e91e8c;
      --pink-pastel:  #f8bbd0;
      --pink-blush:   #fce4ec;
      --pink-glow:    #ff69b4;
      --cream:        #fff8f9;
      --gold:         #f9c74f;
      --gold-light:   #ffeaa0;
      --white:        #ffffff;
      --text-dark:    #2d0a1e;
      --text-mid:     #7b3058;
      --shadow-pink:  rgba(233,30,140,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text-dark);
      overflow-x: hidden;
      cursor: none;
    }

    /* ── CUSTOM CURSOR ── */
    #cursor {
      position: fixed; top: 0; left: 0; z-index: 9999;
      width: 18px; height: 18px;
      background: var(--pink-vivid);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%,-50%);
      transition: width .15s, height .15s, background .15s;
      box-shadow: 0 0 16px var(--pink-glow);
    }
    #cursor.big { width: 38px; height: 38px; background: var(--gold); }
    #cursor-ring {
      position: fixed; top: 0; left: 0; z-index: 9998;
      width: 38px; height: 38px;
      border: 2px solid var(--pink-vivid);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%,-50%);
      transition: transform .08s ease-out, width .2s, height .2s, opacity .2s;
      opacity: .5;
    }

    /* ── FLOATING PARTICLES ── */
    .particle {
      position: fixed; pointer-events: none; z-index: 0;
      border-radius: 50%;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: .6; }
      90%  { opacity: .4; }
      100% { transform: translateY(-120px) rotate(720deg); opacity: 0; }
    }

    /* ── HERO ── */
    #hero {
      position: relative;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      overflow: hidden;
      background: linear-gradient(145deg, #fff0f5 0%, #fce4ec 40%, #f8bbd0 100%);
      padding: 40px 24px 80px;
    }

    #hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 80% 20%, rgba(255,105,180,.18) 0%, transparent 70%),
        radial-gradient(ellipse 500px 300px at 10% 80%, rgba(233,30,140,.12) 0%, transparent 70%);
    }

    .sparkle-ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 640px; height: 640px;
      border-radius: 50%;
      border: 2px dashed rgba(233,30,140,.15);
      animation: spin 40s linear infinite;
    }
    .sparkle-ring:nth-child(2) {
      width: 820px; height: 820px;
      border-color: rgba(249,199,79,.12);
      animation-duration: 60s; animation-direction: reverse;
    }
    @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

    .hero-badge {
      position: relative; z-index: 2;
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(233,30,140,.2);
      border-radius: 100px;
      padding: 10px 24px;
      font-size: 13px; font-weight: 500;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--pink-deep);
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(233,30,140,.1);
      animation: fadeSlideDown .8s ease both;
    }
    .hero-badge span { font-size: 18px; }

    .hero-title {
      position: relative; z-index: 2;
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 9vw, 7.5rem);
      font-weight: 900;
      line-height: .95;
      letter-spacing: -.02em;
      color: var(--pink-deep);
      animation: fadeSlideDown .9s .1s ease both;
    }
    .hero-title em {
      font-style: italic;
      background: linear-gradient(135deg, var(--pink-vivid), var(--pink-deep));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-title .gold-word {
      background: linear-gradient(135deg, #f9c74f, #ff9a3c);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      position: relative; z-index: 2;
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      font-weight: 300;
      color: var(--text-mid);
      margin: 20px auto 48px;
      max-width: 520px;
      line-height: 1.7;
      animation: fadeSlideDown 1s .2s ease both;
    }

    .hero-girls {
      position: relative; z-index: 2;
      display: flex; gap: 20px; justify-content: center;
      flex-wrap: wrap;
      animation: fadeSlideUp 1.1s .35s ease both;
    }

    /* ── PPG CARD ── */
    .ppg-card {
      position: relative;
      width: 170px;
      background: white;
      border-radius: 28px;
      padding: 28px 18px 22px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s;
      cursor: pointer;
    }
    .ppg-card:hover {
      transform: translateY(-14px) scale(1.05);
      box-shadow: 0 28px 60px var(--shadow-pink);
    }
    .ppg-card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 28px;
      opacity: 0;
      transition: opacity .35s;
    }
    .ppg-card:hover::before { opacity: 1; }

    .ppg-card.blossom::before { background: linear-gradient(160deg,rgba(255,192,203,.3),rgba(255,105,180,.15)); }
    .ppg-card.bubbles::before { background: linear-gradient(160deg,rgba(173,216,230,.3),rgba(100,149,237,.15)); }
    .ppg-card.buttercup::before { background: linear-gradient(160deg,rgba(144,238,144,.3),rgba(50,205,50,.15)); }

    .ppg-avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      position: relative;
      overflow: hidden;
    }
    .ppg-card.blossom .ppg-avatar { background: radial-gradient(circle, #ffb6c1, #ff69b4); }
    .ppg-card.bubbles .ppg-avatar { background: radial-gradient(circle, #b0d4f1, #6496e8); }
    .ppg-card.buttercup .ppg-avatar { background: radial-gradient(circle, #c8f5a0, #7ecb42); }

    .ppg-name {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      margin-bottom: 6px;
    }
    .ppg-card.blossom .ppg-name { color: #c2185b; }
    .ppg-card.bubbles .ppg-name { color: #1565c0; }
    .ppg-card.buttercup .ppg-name { color: #2e7d32; }

    .ppg-power {
      font-size: .75rem;
      font-weight: 400;
      color: #999;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .ppg-pill {
      margin-top: 12px;
      display: inline-block;
      font-size: .72rem;
      font-weight: 500;
      border-radius: 100px;
      padding: 5px 14px;
      letter-spacing: .05em;
    }
    .ppg-card.blossom .ppg-pill  { background: #ffe4ef; color: #c2185b; }
    .ppg-card.bubbles .ppg-pill  { background: #e3eeff; color: #1565c0; }
    .ppg-card.buttercup .ppg-pill { background: #e8f5e9; color: #2e7d32; }

    /* ── SCROLL CTA ── */
    .scroll-cta {
      position: absolute; bottom: 36px; left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      font-size: .75rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-mid); opacity: .6;
      animation: fadeSlideUp 1.2s .6s ease both;
    }
    .scroll-arrow {
      width: 30px; height: 30px;
      border: 2px solid var(--pink-vivid);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: bounce 1.6s ease infinite;
      color: var(--pink-vivid); font-size: 14px;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(6px); }
    }

    /* ── SECTION SHARED ── */
    section {
      padding: 100px 24px;
      position: relative;
    }
    .section-label {
      display: inline-block;
      font-size: .72rem; letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--pink-vivid);
      font-weight: 600;
      margin-bottom: 14px;
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      color: var(--text-dark);
      margin-bottom: 24px;
    }
    .section-title em {
      font-style: italic;
      background: linear-gradient(135deg, var(--pink-vivid), var(--pink-deep));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── LEKHYA TRIBUTE ── */
    #tribute {
      background: white;
      text-align: center;
    }
    .tribute-inner { max-width: 800px; margin: 0 auto; }

    .name-display {
      font-family: 'Pacifico', cursive;
      font-size: clamp(3rem, 10vw, 7rem);
      background: linear-gradient(135deg, var(--pink-vivid) 0%, #ff8db6 40%, var(--gold) 80%, #f9a03f 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 20px 0 32px;
      line-height: 1.1;
      animation: shimmer 4s ease infinite alternate;
      background-size: 200% 200%;
    }
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .tribute-text {
      font-size: 1.15rem; line-height: 1.9;
      color: var(--text-mid);
      font-weight: 300;
      max-width: 600px; margin: 0 auto 48px;
    }
    .tribute-text strong { color: var(--pink-vivid); font-weight: 600; }

    .stats-row {
      display: flex; justify-content: center; gap: 40px;
      flex-wrap: wrap; margin-top: 20px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem; font-weight: 900;
      background: linear-gradient(135deg, var(--pink-vivid), var(--pink-deep));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .stat-label {
      font-size: .78rem; letter-spacing: .1em;
      text-transform: uppercase; color: #bbb;
      margin-top: 6px;
    }

    /* ── POWERS GRID ── */
    #powers {
      background: linear-gradient(160deg, #fff0f5, #fce4ec);
    }
    .powers-inner { max-width: 1100px; margin: 0 auto; }
    .powers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      margin-top: 56px;
    }
    .power-card {
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      position: relative;
      overflow: hidden;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
      cursor: default;
    }
    .power-card:hover {
      transform: translateY(-8px) rotate(-1deg);
      box-shadow: 0 24px 60px rgba(233,30,140,.15);
    }
    .power-card::after {
      content: '';
      position: absolute; bottom: -40px; right: -40px;
      width: 140px; height: 140px;
      border-radius: 50%;
      opacity: .06;
      background: var(--pink-vivid);
      transition: transform .4s;
    }
    .power-card:hover::after { transform: scale(1.4); }
    .power-icon { font-size: 2.6rem; margin-bottom: 18px; }
    .power-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.25rem; margin-bottom: 10px;
      color: var(--pink-deep);
    }
    .power-desc {
      font-size: .88rem; line-height: 1.7;
      color: #888;
    }
    .power-tag {
      display: inline-block;
      margin-top: 16px;
      font-size: .7rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 100px;
      background: var(--pink-blush);
      color: var(--pink-vivid);
    }

    /* ── QUOTE SECTION ── */
    #quote-section {
      background: linear-gradient(135deg, var(--pink-deep) 0%, #880e4f 100%);
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    #quote-section::before {
      content: '"';
      position: absolute; top: -60px; left: -10px;
      font-family: 'Playfair Display', serif;
      font-size: 28rem;
      color: rgba(255,255,255,.04);
      line-height: 1;
      pointer-events: none;
    }
    .quote-inner { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 3.5vw, 2.6rem);
      font-style: italic;
      font-weight: 700;
      color: white;
      line-height: 1.45;
      margin-bottom: 32px;
    }
    .quote-author {
      font-size: .82rem; letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.5);
    }
    .quote-dots {
      display: flex; gap: 10px; justify-content: center;
      margin-bottom: 40px;
    }
    .qdot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      cursor: pointer;
      transition: background .25s, transform .25s;
    }
    .qdot.active { background: white; transform: scale(1.3); }

    /* ── ACTIVITY / TRIVIA ── */
    #trivia {
      background: white;
    }
    .trivia-inner { max-width: 760px; margin: 0 auto; text-align: center; }
    .trivia-question {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 700;
      color: var(--text-dark);
      margin: 48px 0 32px;
      min-height: 3em;
      transition: opacity .35s;
    }
    .trivia-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 30px;
    }
    .trivia-btn {
      background: var(--pink-blush);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 18px 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      color: var(--pink-deep);
      cursor: pointer;
      transition: all .25s;
    }
    .trivia-btn:hover {
      border-color: var(--pink-vivid);
      background: white;
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(233,30,140,.12);
    }
    .trivia-btn.correct {
      background: #e8f5e9; border-color: #43a047; color: #2e7d32;
    }
    .trivia-btn.wrong {
      background: #fce4ec; border-color: #e91e63; color: #c2185b;
    }
    .trivia-feedback {
      font-size: 1rem; font-weight: 500;
      min-height: 1.8em; color: var(--pink-vivid);
      margin-bottom: 20px;
    }
    .trivia-next-btn {
      background: linear-gradient(135deg, var(--pink-vivid), var(--pink-deep));
      color: white;
      border: none;
      border-radius: 100px;
      padding: 15px 40px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(233,30,140,.3);
      transition: transform .25s, box-shadow .25s;
      display: none;
    }
    .trivia-next-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 36px rgba(233,30,140,.4);
    }
    .trivia-score {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; color: var(--text-mid);
      margin-top: 8px;
    }

    /* ── GALLERY ── */
    #gallery {
      background: linear-gradient(160deg, #fff8f9, #fce4ec);
    }
    .gallery-inner { max-width: 1100px; margin: 0 auto; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-auto-rows: 160px;
      gap: 16px;
      margin-top: 56px;
    }
    .gal-item {
      border-radius: 20px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
      position: relative;
      cursor: pointer;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s;
    }
    .gal-item:hover {
      transform: scale(1.04);
      box-shadow: 0 20px 50px rgba(0,0,0,.12);
      z-index: 2;
    }
    .gal-item span {
      position: relative; z-index: 1;
      text-shadow: 0 4px 12px rgba(0,0,0,.2);
      transition: transform .3s;
    }
    .gal-item:hover span { transform: scale(1.15) rotate(-5deg); }

    .gal-item:nth-child(1) { grid-column: span 2; grid-row: span 2; background: linear-gradient(135deg,#ffb6c1,#ff69b4); }
    .gal-item:nth-child(2) { grid-column: span 2; background: linear-gradient(135deg,#fce4ec,#f48fb1); }
    .gal-item:nth-child(3) { grid-column: span 2; background: linear-gradient(135deg,#e1f5fe,#90caf9); }
    .gal-item:nth-child(4) { grid-column: span 1; background: linear-gradient(135deg,#c8f5a0,#7ecb42); }
    .gal-item:nth-child(5) { grid-column: span 1; background: linear-gradient(135deg,#fff9c4,#f9c74f); }
    .gal-item:nth-child(6) { grid-column: span 2; background: linear-gradient(135deg,#e040fb,#aa00ff); }
    .gal-item:nth-child(7) { grid-column: span 2; background: linear-gradient(135deg,#ff80ab,#f50057); }
    .gal-item:nth-child(8) { grid-column: span 2; background: linear-gradient(135deg,#ffe0b2,#ff9800); }

    .gal-label {
      position: absolute; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      font-size: .7rem; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      color: rgba(255,255,255,.9);
      background: rgba(0,0,0,.18);
      padding: 4px 12px; border-radius: 100px;
      white-space: nowrap;
    }

    /* ── FOOTER ── */
    #footer {
      background: var(--text-dark);
      color: white;
      text-align: center;
      padding: 70px 24px;
    }
    .footer-heart {
      font-size: 2.5rem;
      animation: heartbeat 1.2s ease infinite;
      display: block; margin-bottom: 18px;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      14%      { transform: scale(1.25); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.15); }
      70%      { transform: scale(1); }
    }
    .footer-title {
      font-family: 'Pacifico', cursive;
      font-size: 1.6rem;
      background: linear-gradient(135deg, var(--pink-glow), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
    }
    .footer-sub {
      font-size: .85rem; color: rgba(255,255,255,.35);
      letter-spacing: .06em;
    }

    /* ── CONFETTI BURST ── */
    .confetti-piece {
      position: fixed; top: 50%; left: 50%;
      width: 10px; height: 10px;
      border-radius: 2px;
      pointer-events: none; z-index: 9000;
      animation: confettiFly .8s ease forwards;
    }
    @keyframes confettiFly {
      0%   { transform: translate(-50%,-50%) scale(0); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot)); opacity: 0; }
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reveal {
      opacity: 0;
      transform: translateY(36px);
      transition: opacity .8s ease, transform .8s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /*
